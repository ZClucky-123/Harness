<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ title }}</title>
  <link rel="stylesheet" href="{{ url_for('static', path='styles.css') }}">
</head>
<body>
  <main>
    <header class="topbar">
      <pre class="wordmark">GUARDED
HARNESS</pre>
      <nav><a href="/approvals">Approvals</a></nav>
    </header>
    <section class="hero-terminal" aria-label="Harness terminal preview">
      <p class="terminal-muted">[agent = llm + harness]</p>
      <h1>Guarded Harness</h1>
      <p>| governance guardrails | hitl state machine | provider adapters |</p>
      <div class="prompt-row">mode: <strong>mock/live</strong> · provider: <strong>OpenAI-compatible</strong></div>
    </section>
    <form class="terminal-form" action="/sessions" method="post">
      <fieldset>
        <legend>[+] Provider</legend>
        <div class="mode-grid">
          <label><input type="radio" name="mode" value="mock" checked> Mock deterministic run</label>
          <label><input type="radio" name="mode" value="live"> Live OpenAI-compatible API</label>
        </div>
        <label for="base_url">GUARDED_HARNESS_BASE_URL</label>
        <input id="base_url" name="base_url" value="{{ base_url }}">
        <label for="model">GUARDED_HARNESS_MODEL</label>
        <input id="model" name="model" value="{{ model }}">
        <label for="api_key">API key {% if credential_configured %}(stored key available){% endif %}</label>
        <input id="api_key" name="api_key" type="password" autocomplete="off" placeholder="Paste key for live mode">
        <label><input type="checkbox" name="save_api_key"> Save key to OS keyring</label>
      </fieldset>
      <fieldset>
      <legend>[+] Task</legend>
      <label for="task">Task</label>
      <textarea id="task" name="task" required></textarea>
      <button type="submit">Start task</button>
      </fieldset>
    </form>
  </main>
</body>
</html>
