<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ title }}</title>
  <link rel="stylesheet" href="{{ url_for('static', path='styles.css') }}">
</head>
<body>
  <main>
    <header class="topbar">
      <pre class="wordmark">GUARDED
HARNESS</pre>
      <nav><a href="/">Dashboard</a> <a href="/approvals">Approvals</a> <a href="/guardrail">Guardrail Demo</a></nav>
    </header>
    <section class="hero-terminal compact">
      <p class="terminal-muted">[provider]</p>
      <h1>Provider Settings</h1>
      <p>key: {% if credential_configured %}configured{% else %}missing{% endif %}</p>
    </section>
    <form class="terminal-form" action="/settings" method="post">
      <fieldset>
        <legend>[+] Mode</legend>
        <div class="mode-grid">
          <label><input type="radio" name="mode" value="mock" {% if settings.mode == "mock" %}checked{% endif %}> Mock deterministic run</label>
          <label><input type="radio" name="mode" value="live" {% if settings.mode == "live" %}checked{% endif %}> Live OpenAI-compatible API</label>
        </div>
      </fieldset>
      <fieldset>
        <legend>[+] Endpoint</legend>
        <label for="base_url">GUARDED_HARNESS_BASE_URL</label>
        <input id="base_url" name="base_url" value="{{ settings.base_url }}">
        <label for="model">GUARDED_HARNESS_MODEL</label>
        <input id="model" name="model" value="{{ settings.model }}">
        <label for="api_key">API key</label>
        <input id="api_key" name="api_key" type="password" autocomplete="off" placeholder="Paste key only when updating">
        <label><input type="checkbox" name="save_api_key"> Save key to OS keyring</label>
      </fieldset>
      <button type="submit">Save provider</button>
    </form>
  </main>
</body>
</html>
