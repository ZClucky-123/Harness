stages:
  - test
  - build

unit-test:
  stage: test
  image: python:3.11-slim
  script:
    - python -m pip install --upgrade pip
    - pip install -e ".[dev]"
    - pytest
    - python -m compileall src

docker-build:
  stage: build
  image: docker:27
  services:
    - docker:27-dind
  script:
    - docker build -t guarded-harness .
  rules:
    - if: '$CI_COMMIT_BRANCH'
